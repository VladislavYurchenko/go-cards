<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070B10">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#D9E1E8">
<title>Go-лента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: вертикальная лента во весь экран, одна карточка — один вопрос; на широком экране лента идёт колонкой по центру */
:root {
  --ground: #070B10;
  --text: #EDF2F7;
  --muted: #9AA8B6;
  --line: rgba(237, 242, 247, .14);
  --glass: rgba(9, 13, 19, .62);
  --chip: rgba(237, 242, 247, .08);
  --btn: rgba(237, 242, 247, .07);
  --btn-line: rgba(237, 242, 247, .2);
  --btn-hover: rgba(237, 242, 247, .13);
  --drawer: #111821;
  --scrim: rgba(3, 6, 10, .62);
  --shadow: rgba(0, 0, 0, .45);
  --ok: #3BD18A;
  --ok-soft: rgba(59, 209, 138, .16);
  --bad: #FF5A78;
  --bad-soft: rgba(255, 90, 120, .16);
  --on-bad: #1A0409;
  --half: #FFB547;
  --pane-l1: .31;
  --pane-l2: .15;
  --pane-c: .075;
  --acc-l: .82;
  --acc-c: .13;
  --on-acc: #081016;
  --code-bg: #0A1016;
  --code-fg: #DCE6EE;
  --code-dim: #71849A;
  --code-line: rgba(220, 230, 238, .1);
  --syn-kw: #FF8FB1;
  --syn-str: #A9E178;
  --syn-num: #FFC66D;
  --syn-fn: #7CC7FF;
  --syn-type: #C9AEFF;
  --term-err: #FF7F96;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --col: 460px;
  --bar-h: 52px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #D9E1E8; --text: #0F1720; --muted: #4D5C6A; --line: rgba(15, 23, 32, .13);
    --glass: rgba(247, 249, 251, .74); --chip: rgba(15, 23, 32, .06); --btn: rgba(255, 255, 255, .72);
    --btn-line: rgba(15, 23, 32, .17); --btn-hover: #FFFFFF; --drawer: #F7F9FB; --scrim: rgba(15, 23, 32, .38);
    --shadow: rgba(15, 23, 32, .18); --ok: #0C8A54; --ok-soft: rgba(12, 138, 84, .13); --bad: #D3264F;
    --bad-soft: rgba(211, 38, 79, .11); --on-bad: #FFFFFF; --half: #A86200; --pane-l1: .975; --pane-l2: .905;
    --pane-c: .04; --acc-l: .5; --acc-c: .16; --on-acc: #FFFFFF; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground: #D9E1E8; --text: #0F1720; --muted: #4D5C6A; --line: rgba(15, 23, 32, .13);
  --glass: rgba(247, 249, 251, .74); --chip: rgba(15, 23, 32, .06); --btn: rgba(255, 255, 255, .72);
  --btn-line: rgba(15, 23, 32, .17); --btn-hover: #FFFFFF; --drawer: #F7F9FB; --scrim: rgba(15, 23, 32, .38);
  --shadow: rgba(15, 23, 32, .18); --ok: #0C8A54; --ok-soft: rgba(12, 138, 84, .13); --bad: #D3264F;
  --bad-soft: rgba(211, 38, 79, .11); --on-bad: #FFFFFF; --half: #A86200; --pane-l1: .975; --pane-l2: .905;
  --pane-c: .04; --acc-l: .5; --acc-c: .16; --on-acc: #FFFFFF; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ground); color: var(--text);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

#app { position: fixed; inset: 0; }
#feed {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory; overscroll-behavior-y: contain; scrollbar-width: none;
}
#feed::-webkit-scrollbar { display: none; }
.card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; justify-content: center; }
.panel {
  --acc: oklch(var(--acc-l) var(--acc-c) var(--h));
  position: relative; width: 100%; max-width: var(--col); height: 100%; overflow: hidden;
  background: linear-gradient(168deg,
    oklch(var(--pane-l1) var(--pane-c) var(--h)) 0%,
    oklch(var(--pane-l2) calc(var(--pane-c) * .7) var(--h)) 74%);
}
.inner {
  height: 100%; overflow-y: auto; overscroll-behavior-y: auto; scrollbar-width: thin;
  display: flex; flex-direction: column; gap: 16px;
  padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.body { margin-block: auto; display: grid; gap: 14px; min-width: 0; }

.head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ava {
  flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  font: 600 12.5px/1 var(--font-mono); color: var(--acc); background: var(--chip); border: 1.5px solid var(--acc);
}
.who { min-width: 0; display: grid; line-height: 1.25; }
.who b { font-weight: 700; font-size: 15px; }
.who small { color: var(--muted); font-size: 13px; }
.like {
  margin-left: auto; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--muted); display: grid; place-items: center; cursor: pointer;
}
.like svg { width: 22px; height: 22px; }
.like path { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; }
.like[aria-pressed="true"] { color: var(--bad); }
.like[aria-pressed="true"] path { fill: currentColor; }
.like.pop svg { animation: pop .32s ease-out; }

.q { margin: 0; font-size: clamp(19px, 5.3vw, 23px); line-height: 1.32; font-weight: 600; text-wrap: balance; }
.q.note { font-size: 15px; font-weight: 600; color: var(--muted); }

.code { background: var(--code-bg); border: 1px solid var(--code-line); border-radius: 16px; overflow: hidden; min-width: 0; }
.code-head {
  display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px;
  font: 500 11.5px/1.2 var(--font-mono); color: var(--code-dim); border-bottom: 1px solid var(--code-line);
}
.code pre {
  margin: 0; padding: 12px 14px 14px; overflow-x: auto; color: var(--code-fg);
  font-family: var(--font-mono); font-size: var(--code-fs, 14px); line-height: 1.55; tab-size: var(--tab, 4);
}
.k { color: var(--syn-kw); }
.s { color: var(--syn-str); }
.n { color: var(--syn-num); }
.f { color: var(--syn-fn); }
.y { color: var(--syn-type); }
.c { color: var(--code-dim); font-style: italic; }

.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 14px;
  text-align: left; border-radius: 14px; border: 1.5px solid var(--btn-line); background: var(--btn);
  font: 500 16px/1.35 var(--font-body); cursor: pointer;
  transition: background .15s, border-color .15s, opacity .2s, transform .1s;
}
.opt.mono { font-family: var(--font-mono); font-size: 14.5px; }
.opt .txt { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.opt .num {
  flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  font: 600 12px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line);
}
@media (hover: hover) { .opt:hover { background: var(--btn-hover); } }
@media (hover: none) { .opt .num { display: none; } }
.opt:active { transform: scale(.985); }
.done .opt { cursor: default; transform: none; }
.done .opts .opt:not(.right):not(.wrong), .done .tf .opt:not(.right):not(.wrong),
.done .grades .opt:not(.picked) { opacity: .42; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .34s; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { justify-content: center; min-height: 64px; font-size: 18px; font-weight: 700; }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grades .opt { justify-content: center; gap: 8px; padding-inline: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; }
@media (max-width: 419px) { .grades .num { display: none; } }
.grades .opt.picked.ok { border-color: var(--ok); background: var(--ok-soft); }
.grades .opt.picked.half { border-color: var(--half); }
.grades .opt.picked.bad { border-color: var(--bad); background: var(--bad-soft); }
.reveal {
  min-height: 56px; border-radius: 14px; border: 1.5px dashed var(--btn-line); background: var(--btn);
  font-weight: 700; font-size: 16px; cursor: pointer;
}
.answer { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--chip); font-size: 16px; line-height: 1.58; animation: rise .22s ease-out; }

.result { display: grid; gap: 12px; animation: rise .24s ease-out; }
.verdict { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 700 22px/1.2 var(--font-display); }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.verdict.half { color: var(--half); }
.verdict small { font: 600 14px/1.3 var(--font-body); color: var(--muted); }
.term {
  margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--code-bg); color: var(--code-fg);
  border: 1px solid var(--code-line); font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
}
.term .p { color: var(--syn-fn); }
.term .e { color: var(--term-err); }
.term .d { color: var(--code-dim); }
.why { margin: 0; font-size: 16px; line-height: 1.58; }
code.i { font-family: var(--font-mono); font-size: .88em; background: var(--chip); padding: .08em .35em; border-radius: 6px; overflow-wrap: anywhere; }
.next {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; width: 100%;
  border: 0; border-radius: 14px; background: var(--acc); color: var(--on-acc); font-weight: 700; font-size: 16px; cursor: pointer;
}
.next svg { width: 18px; height: 18px; }
.ghost {
  min-height: 52px; width: 100%; border-radius: 14px; border: 1.5px solid var(--btn-line); background: var(--btn);
  font-weight: 600; font-size: 16px; cursor: pointer;
}

.special .body { gap: 16px; }
.kicker { margin: 0; font: 600 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }
.big { margin: 0; font: 700 clamp(30px, 9vw, 42px)/1.06 var(--font-display); text-wrap: balance; }
.line { margin: 0; font-size: 17px; line-height: 1.5; }
.line.dim { color: var(--muted); font-size: 15px; }
.actions { display: grid; gap: 10px; margin-top: 6px; }
.swipe { margin: 4px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 14px; }
.swipe svg { width: 18px; height: 18px; animation: nudge 1.6s ease-in-out infinite; }

#bar {
  position: absolute; z-index: 6; top: 0; left: 50%; transform: translateX(-50%);
  width: min(100%, var(--col)); height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center;
  background: var(--glass); -webkit-backdrop-filter: saturate(1.5) blur(18px); backdrop-filter: saturate(1.5) blur(18px);
  border-bottom: 1px solid var(--line);
}
#tabs { display: flex; justify-content: center; gap: 16px; min-width: 0; }
.tab {
  position: relative; border: 0; background: none; color: var(--muted); padding: 12px 1px;
  font-weight: 600; font-size: 15px; line-height: 1; white-space: nowrap; cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 2.5px; border-radius: 2px; background: currentColor;
}
.badge {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 5px;
  border-radius: 9px; background: var(--bad); color: var(--on-bad); font: 700 11px/1 var(--font-mono); vertical-align: 1px;
}
.icon-btn {
  position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent;
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn > svg { width: 24px; height: 24px; }
.icon-btn .stroke { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
#btn-topics.on::after {
  content: ""; position: absolute; top: 9px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--half);
}
.ring { width: 34px; height: 34px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: var(--ok); stroke-linecap: round; stroke-dasharray: 94.25; stroke-dashoffset: 94.25; transition: stroke-dashoffset .4s; }
#ring-n { position: absolute; font: 700 11px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

#desk-nav { position: absolute; z-index: 4; top: 50%; right: calc(50% - var(--col) / 2 - 76px); transform: translateY(-50%); display: grid; gap: 12px; }
.nav-btn {
  width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--line); background: var(--btn);
  display: grid; place-items: center; cursor: pointer;
}
.nav-btn svg { width: 22px; height: 22px; }
@media (hover: hover) { .nav-btn:hover { background: var(--btn-hover); } }
#brand, #keys { position: absolute; z-index: 4; left: max(32px, calc(50% - var(--col) / 2 - 300px)); width: 230px; }
#brand { top: 30px; margin: 0; font: 700 26px/1.1 var(--font-display); }
#brand small { display: block; margin-top: 8px; font: 500 14px/1.4 var(--font-body); color: var(--muted); }
#keys { bottom: 32px; margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; color: var(--muted); font-size: 14px; }
#keys kbd {
  display: inline-block; min-width: 24px; padding: 2px 6px; margin-right: 6px; border-radius: 6px; border: 1px solid var(--line);
  font: 600 12px/1.4 var(--font-mono); color: var(--text); text-align: center;
}
@media (max-width: 719px) { #desk-nav { display: none; } }
@media (max-width: 1099px) { #brand, #keys { display: none; } }
@media (min-width: 720px) {
  .panel { height: calc(100% - 28px); margin-block: 14px; border-radius: 26px; box-shadow: 0 24px 70px var(--shadow); }
  #bar { top: 14px; border-radius: 26px 26px 0 0; }
}
@media (max-width: 379px) { #tabs { gap: 11px; } .tab { font-size: 14px; } }

#scrim { position: fixed; inset: 0; z-index: 9; background: var(--scrim); animation: fade .2s; }
.drawer {
  position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(100%, var(--col)); max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--drawer); border-radius: 22px 22px 0 0; box-shadow: 0 -12px 50px var(--shadow);
  padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; animation: up .24s ease-out;
  --h: 189; --acc: oklch(var(--acc-l) var(--acc-c) var(--h));
}
.drawer:focus { outline: none; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.d-head h2 { margin: 0; font: 700 21px/1.2 var(--font-display); }
.close {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--chip); display: grid; place-items: center; cursor: pointer;
}
.close svg { width: 18px; height: 18px; }
.level { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); font-size: 14px; }
.level b { color: var(--text); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: grid; gap: 2px; padding: 12px 14px; border-radius: 14px; background: var(--chip); }
.tile b { font: 700 24px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13px; }
.d-sec { display: grid; gap: 10px; }
.d-sec h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; padding: 3px; border-radius: 12px; background: var(--chip); }
.seg button {
  flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 6px; border-radius: 9px;
  font-weight: 600; font-size: 14px; line-height: 1; cursor: pointer; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--btn-hover); color: var(--text); box-shadow: 0 1px 4px var(--shadow); }
.trows { display: grid; gap: 2px; }
.trow {
  --acc: oklch(var(--acc-l) var(--acc-c) var(--h));
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  width: 100%; padding: 7px 6px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer;
}
@media (hover: hover) { .trow:hover { background: var(--chip); } }
.trow .ava { width: 34px; height: 34px; font-size: 10.5px; grid-row: span 2; }
.trow .tn { font-weight: 600; font-size: 15px; }
.trow .tc { color: var(--muted); font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.meter { grid-column: 2 / 4; display: flex; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--acc); }
.meter i.p { opacity: .38; }
.hard { display: grid; gap: 6px; }
.hard button {
  display: grid; gap: 2px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: none; text-align: left; cursor: pointer;
}
.hard small { color: var(--muted); font-size: 12.5px; }
.hard span { font: 500 13.5px/1.35 var(--font-mono); overflow-wrap: anywhere; }
.d-foot { display: grid; gap: 10px; color: var(--muted); font-size: 13.5px; }
.d-foot p { margin: 0; }
.danger { border-color: var(--bad); color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  --acc: oklch(var(--acc-l) var(--acc-c) var(--h));
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px;
  border: 1.5px solid var(--btn-line); background: var(--btn); font-weight: 600; font-size: 14px; cursor: pointer;
}
.chip .g {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 600 10px/1 var(--font-mono); color: var(--acc); border: 1.5px solid var(--acc);
}
.chip small { color: var(--muted); font-weight: 500; }
.chip[aria-pressed="false"] { opacity: .42; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

#toast {
  position: fixed; z-index: 12; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--drawer); color: var(--text); font-weight: 600; font-size: 14px; white-space: nowrap;
  box-shadow: 0 8px 30px var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.ava, .code pre, .opt.mono, .term, code.i, .chip .g, #ring-n, #keys kbd, .hard span, .trow .tc {
  font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0;
}
noscript { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
